spring:
  application:
    name: crm-ticket-assistant
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect